<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>findly.lol</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background-color: #0a0a0a;
    color: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 0 20px;
    box-sizing: border-box;
  }
  p {
    font-size: clamp(14px, 2vw, 17px);
    font-weight: 300;
    letter-spacing: 0.02em;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.6);
    max-width: 500px;
    margin: 0;
  }
  a {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    padding-bottom: 2px;
  }
  a:hover {
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.7);
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }
  svg {
    color: rgba(255, 255, 255, 0.5);
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .count {
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
  }
  .glow {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    max-width: 150vw;
    height: 500px;
    background: radial-gradient(ellipse at top, rgba(220, 38, 38, 0.35) 0%, rgba(220, 38, 38, 0.12) 40%, rgba(220, 38, 38, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
    </svg>
    <p>Redirecting in <span class="count" id="count">3</span>s.<br>If nothing happens, <a id="link" href="#">click here</a>.</p>
  </div>

  <script>
    var destination = "https://discord.com/invite/3SQtVC3JNu";
    document.getElementById("link").href = destination;

    var seconds = 3;
    var countEl = document.getElementById("count");
    var timer = setInterval(function () {
      seconds -= 1;
      countEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script>
</body>
</html>
